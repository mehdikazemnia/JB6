name: Weekly Duty Check

on:
  schedule:
    - cron: '0 17 * * 0'
  workflow_dispatch:

jobs:
  duty-check:
    name: Log current duty assignments
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Print this week's duty groups
        run: node send-reminders.js
